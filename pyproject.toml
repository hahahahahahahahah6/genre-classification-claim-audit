[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genre-classification-claim-audit"
version = "0.1.0"
description = "Offline static documentation claim auditor"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

[project.scripts]
genre-classification-claim-audit = "genre_classification_claim_audit.audit:main"

[tool.setuptools.packages.find]
include = ["genre_classification_claim_audit*", "tests"]
